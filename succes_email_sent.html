  <script>
    document.getElementById("scrollToServices").addEventListener("click", function(event) {
    event.preventDefault();
    
    const targetPosition = document.querySelector("#services").offsetTop;
    const startPosition = window.pageYOffset;
    const distance = targetPosition - startPosition -100;
    const duration = 1000; // Adjust duration (milliseconds) for speed
    let start = null;

    function animation(currentTime) {
      if (start === null) start = currentTime;
      const elapsedTime = currentTime - start;
      const progress = Math.min(elapsedTime / duration, 1); // Ensures it stops at 1
      window.scrollTo(0, startPosition + distance * easeInOutQuad(progress));

      if (elapsedTime < duration) requestAnimationFrame(animation);
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    requestAnimationFrame(animation);
  });
  </script>
